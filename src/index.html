<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de ganadores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Selector de ganadores</h1>

    <form id="form-participante" autocomplete="off">
      <label for="nombre">Nombre del participante</label>
      <div class="fila">
        <input id="nombre" type="text" placeholder="Ej. Ana" maxlength="50">
        <button id="agregar" type="submit" class="secundario">Agregar</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section>
      <h2>Participantes (<span id="contador">0</span>)</h2>
      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="vacio">Aún no hay participantes.</p>
    </section>

    <fieldset id="cantidad" class="cantidad">
      <legend>Cantidad de ganadores</legend>
      <div class="opciones">
        <label class="opcion"><input type="radio" name="cantidad" value="1" checked> 1</label>
        <label class="opcion"><input type="radio" name="cantidad" value="2"> 2</label>
        <label class="opcion"><input type="radio" name="cantidad" value="3"> 3</label>
      </div>
    </fieldset>

    <p id="aviso" class="aviso" role="status" hidden></p>

    <button id="sortear" type="button" class="primario" disabled>Sortear ganador</button>

    <p id="cuenta" class="cuenta" role="status" aria-live="assertive" hidden></p>

    <section id="resultado" class="resultado" aria-live="polite" hidden></section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
